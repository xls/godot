name: Build (Windows)

on:
  push:
    branches: [ "4.6-dev" ]
    tags:     [ "v*", "*" ]
  pull_request:
    branches: [ "4.6-dev" ]
  # Also handle a release that’s created from the UI
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      ref:
        description: ‘Branch or tag to build (e.g. 4.6-dev or 4.6-dev-rel1)’
        required: true
        default: ‘4.6-dev’
      publish_release:
        description: ‘Publish as a GitHub Release?’
        required: true
        type: boolean
        default: false

permissions:
  contents: write    # required to create/update releases and upload assets
  actions: read

jobs:
  build-windows:
    runs-on: windows-latest

    env:
      REPO_NAME: ${{ github.event.repository.name }}
      # For manual runs use the input ref, otherwise use the git ref name.
      REF_NAME: ${{ github.event.inputs.ref || github.ref_name }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.ref || github.ref }}
          submodules: recursive

      # Set up MSVC/VS build environment (finds latest installed VS on the runner)
      - name: Set up MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'
          cache: 'pip'

      - name: Install SCons
        run: python -m pip install --upgrade pip scons

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
      
      - name: Install pnpm
        run: npm install -g pnpm

      # If you have JS deps, uncomment:
      # - name: Install JS deps
      #   run: pnpm install --frozen-lockfile

      - name: Run bootstrap.bat
        shell: cmd
        run: |
          call bootstrap.bat

      - name: Build with SCons
        shell: cmd
        run: |
          scons platform=windows

      - name: Determine zip name
        id: name_zip
        shell: pwsh
        run: |
          $branch = '${{ env.REF_NAME }}' -replace '[^a-zA-Z0-9._-]', '-'
          $zip = "godot.windows.$branch.zip"
          "zip_name=$zip" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

      - name: Create ZIP from bin
        id: zip
        shell: pwsh
        run: |
          $zip = "${{ steps.name_zip.outputs.zip_name }}"
          $items = Get-ChildItem -Path "bin" -Include *.exe,*.lib,*.dll,*.pdb -File -Recurse
          if (-not $items -or $items.Count -eq 0) {
            Write-Error "No build outputs found in .\bin (expected *.exe, *.lib, *.dll, *.pdb)."
          }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $zipPath = "dist/$zip"
          if (Test-Path $zipPath) { Remove-Item $zipPath -Force }
          Compress-Archive -Path $items.FullName -DestinationPath $zipPath
          "ZIP_PATH=$zipPath" | Out-File -FilePath $Env:GITHUB_OUTPUT -Append

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.name_zip.outputs.zip_name }}
          path: ${{ steps.zip.outputs.ZIP_PATH }}
          if-no-files-found: error
          retention-days: 14

      # If the run is for a tag (push tags or a published release), attach the zip to the release
      - name: Upload to GitHub Release (tag builds)
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'release' || github.event.inputs.publish_release == 'true'
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.zip.outputs.ZIP_PATH }}
          fail_on_unmatched_files: true
          # If the release doesn't exist (push-tag path), this will create it
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
